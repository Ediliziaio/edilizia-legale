<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Favicon (Edilizia Legale: monogramma navy + gold) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Site-wide invariants only. Per-page metadata (title, description, canonical,
         keywords, Open Graph, Twitter, JSON-LD) is injected per route by the
         vite-react-ssg Head component (src/components/SEO.tsx) during prerender,
         so it is intentionally not duplicated in this template. -->
    <meta name="googlebot" content="index, follow" />
    <meta name="language" content="Italian" />
    <meta name="geo.region" content="IT" />
    <meta name="theme-color" content="#2a3f5f" />

    <!-- Resource hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Fonts -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" rel="stylesheet" />

    <!-- Organization / LegalService JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["LegalService", "Organization"],
      "@id": "https://www.edilizialegale.it/#studio",
      "name": "Edilizia Legale",
      "alternateName": "Studio Legale Edilizia Legale",
      "url": "https://www.edilizialegale.it",
      "logo": "https://www.edilizialegale.it/favicon.svg",
      "image": "https://www.edilizialegale.it/og-image.png",
      "description": "Studio legale specializzato in diritto dell'edilizia: appalti privati e pubblici, recupero crediti delle imprese edili, contenzioso tributario edile, difetti costruttivi e tutela dei committenti.",
      "priceRange": "€€",
      "areaServed": { "@type": "Country", "name": "Italia" },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "09:00",
        "closes": "18:30"
      },
      "email": "info@edilizialegale.it",
      "knowsAbout": [
        "Diritto dell'edilizia",
        "Contratto di appalto",
        "Subappalto",
        "Recupero crediti edilizia",
        "Riserve e varianti",
        "Appalti pubblici",
        "Difetti costruttivi",
        "Garanzia decennale",
        "Contenzioso tributario",
        "Superbonus",
        "DURC",
        "Sicurezza nei cantieri",
        "Condominio"
      ]
    }
    </script>

    <!-- WebSite JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.edilizialegale.it/#website",
      "url": "https://www.edilizialegale.it",
      "name": "Edilizia Legale",
      "inLanguage": "it-IT",
      "publisher": { "@id": "https://www.edilizialegale.it/#studio" }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      Per utilizzare al meglio il sito Edilizia Legale attiva JavaScript nel tuo browser. Puoi comunque contattarci a info@edilizialegale.it.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
