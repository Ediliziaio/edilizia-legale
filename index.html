<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Favicon (Edilizia Legale: marchio a scudo, navy + oro) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canali di scoperta: il feed per aggregatori e crawler, llms.txt per i
         motori generativi. Entrambi rigenerati a ogni build dai contenuti. -->
    <link rel="alternate" type="application/rss+xml" title="Edilizia Legale — Guide" href="/feed.xml" />

    <!-- Site-wide invariants only. Per-page metadata (title, description, canonical,
         keywords, Open Graph, Twitter, JSON-LD) is injected per route by the
         vite-react-ssg Head component (src/components/SEO.tsx) during prerender,
         so it is intentionally not duplicated in this template. -->
    <meta name="googlebot" content="index, follow" />
    <meta name="language" content="Italian" />
    <meta name="geo.region" content="IT" />
    <meta name="theme-color" content="#2a3f5f" />

    <!-- Senza JavaScript le sezioni con animazione d'ingresso resterebbero a
         opacità zero: qui vengono forzate visibili. -->
    <noscript><style>.el-reveal{opacity:1!important;transform:none!important}</style></noscript>

    <!-- Resource hints -->
    <!-- Caratteri ospitati sul sito: nessuna richiesta a fonts.googleapis.com,
         quindi nessun indirizzo IP dei visitatori inviato a terzi (il punto su
         cui il Garante tedesco ha già sanzionato) e un round-trip in meno. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/inter-tight.css" />

    <!-- Organization / LegalService JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["LegalService", "Organization"],
      "@id": "https://www.edilizialegale.it/#studio",
      "name": "Edilizia Legale",
      "alternateName": "Studio Legale Edilizia Legale",
      "url": "https://www.edilizialegale.it",
      "logo": "https://www.edilizialegale.it/brand/marchio-edilizia-legale.png",
      "image": "https://www.edilizialegale.it/og-image.png",
      "description": "Studio legale specializzato in diritto dell'edilizia: appalti privati e pubblici, recupero crediti delle imprese edili, contenzioso tributario edile, difetti costruttivi e tutela dei committenti.",
      "priceRange": "€€",
      "areaServed": { "@type": "Country", "name": "Italia" },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "09:00",
        "closes": "18:30"
      },
      "email": "info@edilizialegale.it",
      "telephone": "+390200000000",
      "founder": { "@id": "https://www.edilizialegale.it/studio#avvocato" },
      "employee": { "@id": "https://www.edilizialegale.it/studio#avvocato" },
      "knowsAbout": [
        "Diritto dell'edilizia",
        "Contratto di appalto",
        "Subappalto",
        "Recupero crediti edilizia",
        "Riserve e varianti",
        "Appalti pubblici",
        "Difetti costruttivi",
        "Garanzia decennale",
        "Contenzioso tributario",
        "Superbonus",
        "DURC",
        "Sicurezza nei cantieri",
        "Condominio"
      ]
    }
    </script>

    <!-- WebSite JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.edilizialegale.it/#website",
      "url": "https://www.edilizialegale.it",
      "name": "Edilizia Legale",
      "inLanguage": "it-IT",
      "publisher": { "@id": "https://www.edilizialegale.it/#studio" }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      Per utilizzare al meglio il sito Edilizia Legale attiva JavaScript nel tuo browser. Puoi comunque contattarci a info@edilizialegale.it.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
